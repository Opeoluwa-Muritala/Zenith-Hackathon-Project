name: openapi-check
on: {push: {paths: ['backend/**']}, pull_request: {paths: ['backend/**']}}
permissions: {contents: read}
concurrency: {group: 'openapi-${{ github.ref }}', cancel-in-progress: true}
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-groups && uv pip install -r requirements-docs.txt && uv run pytest tests/test_openapi_quality.py tests/test_generated_docs.py -q
        working-directory: backend
