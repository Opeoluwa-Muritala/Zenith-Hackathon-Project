name: mobile-ci
on: {push: {paths: ['mobile/**']}, pull_request: {paths: ['mobile/**']}}
permissions: {contents: read}
concurrency: {group: 'mobile-${{ github.ref }}', cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew ktlintCheck test assembleDebug
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        with: {name: cashlens-debug, path: mobile/app/build/outputs/apk/debug/*.apk}
