name: mobile-ci
on:
  push:
    paths: ['mobile/**']
  pull_request:
    paths: ['mobile/**']
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - run: npx expo-doctor
      - run: npx expo export --platform android
      - uses: actions/upload-artifact@v7
        with:
          name: cashlens-android-bundle
          path: mobile/dist/**
