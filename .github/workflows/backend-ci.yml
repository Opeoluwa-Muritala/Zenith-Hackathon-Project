name: backend-ci
on: {push: {paths: ['backend/**']}, pull_request: {paths: ['backend/**']}}
permissions: {contents: read}
concurrency: {group: 'backend-${{ github.ref }}', cancel-in-progress: true}
jobs:
  test:
    runs-on: ubuntu-latest
    env: {DATABASE_URL: 'postgresql+asyncpg://localhost/cashlens', AGGREGATOR_PROVIDER: mock, AI_ENABLED_GLOBAL: 'false', AI_PROVIDER: fake}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {enable-cache: true}
      - run: uv sync --all-groups
        working-directory: backend
      - run: uv pip install -r requirements-docs.txt
        working-directory: backend
      - run: uv run ruff check . && uv run ruff format --check . && uv run mypy app
        working-directory: backend
      - run: uv run alembic heads && uv run alembic upgrade head --sql && uv run alembic downgrade head:base --sql
        working-directory: backend
      - run: uv run pytest --cov=app.insights --cov-fail-under=85
        working-directory: backend
