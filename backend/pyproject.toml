[project]
name = "cashlens-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29", "alembic>=1.13", "pydantic-settings>=2.5",
  "pyjwt>=2.9", "python-multipart>=0.0.12", "email-validator>=2.2"
]
[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.13",
    "mypy>=1.11",
    "respx>=0.23.1",
]
[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

